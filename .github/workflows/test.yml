name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
          channel: stable
          cache: true
      - run: flutter pub get
      # firebase_options.dart는 저장소에 없어서 analyze 대신 계산 로직 테스트만 돌린다
      - run: flutter test
